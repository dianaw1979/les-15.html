
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn persoonlijke website</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Algemene opmaak */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
        }

        /* Header */
        header {
            background-color: #243b55;
            padding: 25px;
            text-align: center;
            color: white;
        }

        header h1 {
            margin: 0;
        }

        /* Horizontaal menu */
        nav {
            margin-top: 20px;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #3c6382;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 6px;
            transition: 0.3s;
        }

        /* Hover-effect */
        nav a:hover {
            background-color: #82ccdd;
            color: #243b55;
        }

        /* Hoofdinhoud */
        main {
            text-align: center;
            padding: 40px 20px;
        }

        main p {
            max-width: 600px;
            margin: 20px auto;
            line-height: 1.7;
        }

        main img {
            width: 300px;
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
        }

        /* Footer */
        footer {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- Header met menu -->
    <header>
        <h1>Welkom op mijn website!</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="overmij.html">Over mij</a>
            <a href="hobby.html">Mijn werk</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Inhoud van de pagina -->
    <main>
        <h2>Even voorstellen</h2>

        <p>
            Hallo! Welkom op mijn website, hier kom je meer te weten over mij en mijn werk.
            Neem gerust contact op voor meer informatie.
        </p>

        <img src="BRAM.jpeg" alt="Een foto van mij">
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Mijn persoonlijke website. Alle rechten voorbehouden.</p>
    </footer>

</body>
</html>
